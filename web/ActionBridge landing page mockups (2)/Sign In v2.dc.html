<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF;color:#101814;font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#146B4D;text-decoration:none}
a:hover{color:#0F563D}
:focus-visible{outline:2px solid #146B4D;outline-offset:3px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</helmet>

<div style="min-height:100vh;display:flex;flex-direction:{{ dir }};background:#FFFFFF;font-family:'Geist',system-ui,sans-serif;color:#101814">

  <aside style="position:{{ asidePos }};top:0;flex:{{ asideFlex }};height:{{ asideH }};overflow:hidden;background:#D9E8EE">
    <img src="assets/hero-tooth.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:{{ imgPos }};transform:scaleX(-1)">
    <div aria-hidden="true" style="position:absolute;inset:0;background:linear-gradient(180deg, rgba(245,246,243,.55) 0%, rgba(245,246,243,0) 22%, rgba(245,246,243,0) 62%, rgba(245,246,243,.82) 100%)"></div>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:{{ asidePad }}">
      <a href="ActionBridge%20Landing%20v2.dc.html" aria-label="ActionBridge Dental home" style="align-self:flex-start;display:flex;align-items:center;gap:12px;color:#101814">
        <span style="font-size:18px;font-weight:600;letter-spacing:-0.02em">ActionBridge</span>
        <span style="width:1px;height:16px;background:rgba(16,24,20,.3)"></span>
        <span style="font-size:18px;color:#3A443F">Dental</span>
      </a>
      <sc-if value="{{ split }}" hint-placeholder-val="{{ true }}">
        <p style="margin:0;font-size:clamp(28px,2.6vw,40px);line-height:1.1;font-weight:600;letter-spacing:-0.04em;max-width:460px;color:#101814;text-wrap:balance">A clearer way to understand your dental costs.</p>
      </sc-if>
    </div>
  </aside>

  <main style="flex:{{ mainFlex }};display:flex;flex-direction:column;background:#FFFFFF;min-height:{{ mainMinH }}">
    <sc-if value="{{ split }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;justify-content:flex-end;padding:32px 48px 0">
        <a href="ActionBridge%20Landing%20v2.dc.html" style="font-size:14px;font-weight:500;color:#66706A;padding:8px 0" style-hover="color:#101814">Back to site</a>
      </div>
    </sc-if>
    <div style="flex:1;display:flex;justify-content:center;padding:{{ formPad }}">
      <div style="width:100%;max-width:384px;display:flex;flex-direction:column">
        <div style="font-size:13px;font-weight:500;letter-spacing:.1em;color:#146B4D">{{ eyebrow }}</div>
        <h1 style="margin:16px 0 0;font-size:clamp(28px,2.4vw,34px);line-height:1.12;font-weight:600;letter-spacing:-0.035em;text-wrap:balance">{{ title }}</h1>

        <sc-if value="{{ showForm }}" hint-placeholder-val="{{ true }}">
          <form onSubmit="{{ submit }}" style="margin-top:40px;display:flex;flex-direction:column;gap:24px">
            <label style="display:flex;flex-direction:column;gap:8px">
              <span style="font-size:14px;font-weight:500">Email</span>
              <input type="email" required="" autocomplete="email" value="{{ email }}" onChange="{{ setEmail }}" style="height:54px;padding:0 16px;border:1px solid rgba(16,24,20,.18);border-radius:10px;font-family:inherit;font-size:16px;color:#101814;background:#FFFFFF;outline:none;transition:border-color 200ms,box-shadow 200ms" style-hover="border-color:rgba(16,24,20,.36)" style-focus="border-color:#146B4D;box-shadow:0 0 0 3px rgba(20,107,77,.14)">
            </label>
            <sc-if value="{{ needsPassword }}" hint-placeholder-val="{{ true }}">
              <label style="display:flex;flex-direction:column;gap:8px">
                <span style="display:flex;justify-content:space-between;align-items:baseline;gap:16px">
                  <span style="font-size:14px;font-weight:500">Password</span>
                  <sc-if value="{{ isSignIn }}" hint-placeholder-val="{{ true }}">
                    <button type="button" onClick="{{ goForgot }}" style="background:none;border:0;padding:0;font-family:inherit;font-size:14px;font-weight:500;color:#146B4D;cursor:pointer" style-hover="color:#0F563D;text-decoration:underline">Forgot password?</button>
                  </sc-if>
                </span>
                <input type="password" required="" minlength="8" autocomplete="{{ pwAuto }}" style="height:54px;padding:0 16px;border:1px solid rgba(16,24,20,.18);border-radius:10px;font-family:inherit;font-size:16px;color:#101814;background:#FFFFFF;outline:none;transition:border-color 200ms,box-shadow 200ms" style-hover="border-color:rgba(16,24,20,.36)" style-focus="border-color:#146B4D;box-shadow:0 0 0 3px rgba(20,107,77,.14)">
                <sc-if value="{{ isCreate }}" hint-placeholder-val="{{ false }}">
                  <span style="font-size:13px;color:#66706A">At least 8 characters.</span>
                </sc-if>
              </label>
            </sc-if>
            <button type="submit" style="margin-top:8px;height:54px;border:0;border-radius:10px;background:#146B4D;color:#FFFFFF;font-family:inherit;font-size:16px;font-weight:500;cursor:pointer;transition:background 200ms,transform 150ms" style-hover="background:#0F563D" style-active="transform:scale(.99)">{{ cta }}</button>
          </form>
        </sc-if>

        <sc-if value="{{ isVerify }}" hint-placeholder-val="{{ false }}">
          <div style="margin-top:40px;display:flex;flex-direction:column;gap:24px">
            <p style="margin:0;font-size:17px;line-height:1.6;color:#4E5852;text-wrap:pretty">We sent a verification link to <span style="color:#101814;font-weight:500">{{ emailShown }}</span>. Open it to finish creating your account.</p>
            <button type="button" onClick="{{ resend }}" style="height:54px;border:1px solid rgba(16,24,20,.24);border-radius:10px;background:#FFFFFF;color:#101814;font-family:inherit;font-size:16px;font-weight:500;cursor:pointer;transition:border-color 200ms" style-hover="border-color:#101814">{{ resendLabel }}</button>
          </div>
        </sc-if>

        <div style="margin-top:40px;padding-top:24px;border-top:1px solid rgba(16,24,20,.12);display:flex;flex-wrap:wrap;gap:4px 8px;font-size:15px">
          <span style="color:#66706A">{{ switchText }}</span>
          <button type="button" onClick="{{ switchMode }}" style="background:none;border:0;padding:0;font-family:inherit;font-size:15px;font-weight:500;color:#146B4D;cursor:pointer" style-hover="color:#0F563D;text-decoration:underline">{{ switchCta }}</button>
        </div>
      </div>
    </div>
    <p style="margin:0;padding:{{ footPad }};font-size:13px;line-height:1.5;color:#66706A">Estimates only. Your dentist and insurer determine final treatment and costs.</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    w: typeof window !== 'undefined' ? window.innerWidth : 1440,
    mode: (typeof location !== 'undefined' && /mode=create/.test(location.search)) ? 'create' : 'signin',
    email: '', resent: false
  };
  componentDidMount() {
    this.onR = () => this.forceUpdate();
    this.poll = setInterval(this.onR, 250); setTimeout(() => clearInterval(this.poll), 3000);
    this.onR();
    window.addEventListener('resize', this.onR);
  }
  componentWillUnmount() {
    clearInterval(this.poll); window.removeEventListener('resize', this.onR); }
  renderVals() {
    const w = typeof window !== 'undefined' ? window.innerWidth : 1440, m = this.state.mode, split = w >= 960;
    const copy = {
      signin: ['WELCOME BACK', 'Sign in to continue your saved plans.', 'Sign in', 'New to ActionBridge?', 'Create an account'],
      create: ['NEW ACCOUNT', 'Create an account to save your plans.', 'Create account', 'Already have an account?', 'Sign in'],
      forgot: ['RESET PASSWORD', 'We’ll email you a link to reset it.', 'Send reset link', 'Remembered it?', 'Back to sign in'],
      verify: ['VERIFY EMAIL', 'Check your inbox to confirm your email.', '', 'Wrong address?', 'Use a different email']
    }[m];
    return {
      split, dir: split ? 'row' : 'column',
      asidePos: split ? 'sticky' : 'relative',
      asideFlex: split ? '0 0 58%' : 'none',
      asideH: split ? '100vh' : 'max(220px, 28vh)',
      asidePad: split ? '40px 48px 48px' : '20px 24px',
      imgPos: split ? '6% 72%' : '34% 45%',
      mainFlex: split ? '1 1 auto' : '1 1 auto',
      mainMinH: split ? '100vh' : 'auto',
      formPad: split ? 'min(14vh, 140px) 48px 48px' : '40px 24px 40px',
      footPad: split ? '0 48px 32px' : '0 24px 32px',
      eyebrow: copy[0], title: copy[1], cta: copy[2], switchText: copy[3], switchCta: copy[4],
      showForm: m !== 'verify', isVerify: m === 'verify', isSignIn: m === 'signin', isCreate: m === 'create',
      needsPassword: m === 'signin' || m === 'create',
      pwAuto: m === 'create' ? 'new-password' : 'current-password',
      email: this.state.email, emailShown: this.state.email || 'your email',
      setEmail: e => this.setState({ email: e.target.value }),
      resendLabel: this.state.resent ? 'Email sent again' : 'Resend email',
      resend: () => this.setState({ resent: true }),
      goForgot: () => this.setState({ mode: 'forgot' }),
      switchMode: () => this.setState({ mode: m === 'signin' ? 'create' : (m === 'verify' ? 'create' : 'signin'), resent: false }),
      submit: e => { e.preventDefault(); if (m === 'create') this.setState({ mode: 'verify' }); else if (m === 'forgot') this.setState({ mode: 'signin' }); }
    };
  }
}
</script>
</body>
</html>
