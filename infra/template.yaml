AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  ActionBridge Dental API, Phase 3 vertical slice: cases, estimates and scenarios.
  Cognito login (admin-created demo users, synthetic data only). Code is pre-bundled by `npm run build:lambda`.

Parameters:
  AppEnv:
    Type: String
    AllowedValues: [dev, demo]
    Default: dev
    Description: Stage name and APP_ENV. Deploy dev and the stable demo as separate stacks.
  RetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 90
    Description: Demo case records expire via DynamoDB TTL (eventual deletion, not immediate).
  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Bedrock inference profile the agent worker calls.
  BedrockFoundationModel:
    Type: String
    Default: anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Foundation model behind the inference profile (IAM scope).
  AuthCallbackUrls:
    Type: CommaDelimitedList
    Default: actionbridgedental://auth/callback
    Description: Mobile app redirect URIs for Cognito managed login (authorization code + PKCE).

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    Handler: index.handler
    MemorySize: 512
    Timeout: 10
    Environment:
      Variables:
        APP_ENV: !Ref AppEnv
        # Owner = `sub` claim of a Cognito token already checked by the HttpApi JWT authorizer (D-10).
        AUTH_MODE: jwt
        NODE_OPTIONS: --enable-source-maps

Resources:
  CasesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      UserPoolName: !Sub actionbridge-dental-${AppEnv}
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      # Demo accounts are created by an admin; no public sign-up.
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub actionbridge-dental-mobile-${AppEnv}
      # Public mobile client: no secret; the app uses authorization code + PKCE.
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: !Ref AuthCallbackUrls
      LogoutURLs: !Ref AuthCallbackUrls
      # USER_PASSWORD_AUTH lets the smoke test and a native sign-in form get tokens without a browser redirect.
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub actionbridge-dental-${AppEnv}-${AWS::AccountId}

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref AppEnv
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/.build/health
      Description: GET /health — status and versions only
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /health
            Auth:
              Authorizer: NONE

  CasesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/.build/cases
      Description: Owner-scoped cases, strategy saves and the case ledger (transactional writes)
      Environment:
        Variables:
          TABLE_NAME: !Ref CasesTable
          RETENTION_DAYS: !Ref RetentionDays
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:ConditionCheckItem
                - dynamodb:Query
              Resource: !GetAtt CasesTable.Arn
      Events:
        CreateCase:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/cases
        GetCase:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/cases/{caseId}
        PatchCase:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: PATCH
            Path: /v1/cases/{caseId}
        SaveStrategy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/cases/{caseId}/strategies
        GetLedger:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/cases/{caseId}/ledger

  CalculationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/.build/calculations
      Description: Estimates and schedule comparison from the pure benefits engine (read-only)
      Environment:
        Variables:
          TABLE_NAME: !Ref CasesTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt CasesTable.Arn
      Events:
        Estimate:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/cases/{caseId}/estimates
        Scenarios:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/cases/{caseId}/scenarios
        CoverageComparison:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/cases/{caseId}/coverage-comparison

  JobDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true

  JobQueue:
    Type: AWS::SQS::Queue
    Properties:
      # Longer than the worker timeout, so an in-flight job is not redelivered while it runs.
      VisibilityTimeout: 180
      MessageRetentionPeriod: 3600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt JobDeadLetterQueue.Arn
        maxReceiveCount: 2

  JobsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/.build/jobs
      Description: Agent jobs API — create, view, answer, retry, cancel (enqueues; never calls the model)
      Environment:
        Variables:
          TABLE_NAME: !Ref CasesTable
          RETENTION_DAYS: !Ref RetentionDays
          JOB_QUEUE_URL: !Ref JobQueue
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt CasesTable.Arn
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt JobQueue.Arn
      Events:
        CreateJob:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/cases/{caseId}/jobs
        GetJob:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/jobs/{jobId}
        AnswerJob:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/jobs/{jobId}/answers
        RetryJob:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/jobs/{jobId}/retry
        CancelJob:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/jobs/{jobId}/cancel

  JobWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/.build/job-worker
      Description: Agent worker — bounded Bedrock tool loop over the deterministic engine (SQS, batch 1)
      Timeout: 90
      MemorySize: 1024
      Environment:
        Variables:
          TABLE_NAME: !Ref CasesTable
          RETENTION_DAYS: !Ref RetentionDays
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt CasesTable.Arn
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}
                - !Sub arn:aws:bedrock:*::foundation-model/${BedrockFoundationModel}
            # Anthropic models are billed through AWS Marketplace. Bedrock requires exactly these two
            # actions for the caller (AccessDeniedException text, 2026-10-03). Marketplace actions do not
            # support resource-level scoping; usage is still limited to the one model by InvokeModel above.
            - Effect: Allow
              Action:
                - aws-marketplace:ViewSubscriptions
                - aws-marketplace:Subscribe
              Resource: '*'
      Events:
        Jobs:
          Type: SQS
          Properties:
            Queue: !GetAtt JobQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
            # Caps concurrent model calls (cost and quota) without reserving account concurrency.
            ScalingConfig:
              MaximumConcurrency: 2

  JobsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${JobsFunction}
      RetentionInDays: 7

  JobWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${JobWorkerFunction}
      RetentionInDays: 7

  HealthLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${HealthFunction}
      RetentionInDays: 7

  CasesLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${CasesFunction}
      RetentionInDays: 7

  CalculationsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${CalculationsFunction}
      RetentionInDays: 7

Outputs:
  ApiBaseUrl:
    Description: Base URL including the stage. Set as EXPO_PUBLIC_API_BASE_URL and API_BASE_URL for the smoke test.
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${AppEnv}
  CasesTableName:
    Description: DynamoDB table holding owner-scoped cases
    Value: !Ref CasesTable
  UserPoolId:
    Description: Cognito user pool for admin-created demo accounts
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Public mobile client ID (not a secret). Set as EXPO_PUBLIC_COGNITO_CLIENT_ID.
    Value: !Ref UserPoolClient
  CognitoIssuer:
    Description: Token issuer checked by the API authorizer
    Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
  JobDeadLetterQueueUrl:
    Description: Agent jobs that failed twice in the worker land here for inspection
    Value: !Ref JobDeadLetterQueue
  ManagedLoginDomain:
    Description: Cognito managed login base URL for the mobile PKCE flow
    Value: !Sub https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
