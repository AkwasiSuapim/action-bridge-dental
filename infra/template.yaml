AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  ActionBridge Dental API, Phase 3 vertical slice: cases, estimates and scenarios.
  Cognito login (admin-created demo users, synthetic data only). Code is pre-bundled by `npm run build:lambda`.

Parameters:
  AppEnv:
    Type: String
    AllowedValues: [dev, demo]
    Default: dev
    Description: Stage name and APP_ENV. Deploy dev and the stable demo as separate stacks.
  RetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 90
    Description: Demo case records expire via DynamoDB TTL (eventual deletion, not immediate).
  AuthCallbackUrls:
    Type: CommaDelimitedList
    Default: actionbridgedental://auth/callback
    Description: Mobile app redirect URIs for Cognito managed login (authorization code + PKCE).
  WebAllowedOrigins:
    Type: CommaDelimitedList
    Default: http://localhost:5173,http://127.0.0.1:5173
    Description: >
      Browser origins allowed to call the API (CORS), e.g. add the Vercel site
      https://<project>.vercel.app. Exact origins only; never "*". Native mobile calls are unaffected.

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    Handler: index.handler
    MemorySize: 512
    Timeout: 10
    Environment:
      Variables:
        APP_ENV: !Ref AppEnv
        # Owner = `sub` claim of a Cognito token already checked by the HttpApi JWT authorizer (D-10).
        AUTH_MODE: jwt
        NODE_OPTIONS: --enable-source-maps

Resources:
  CasesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      UserPoolName: !Sub actionbridge-dental-${AppEnv}
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      # Demo accounts are created by an admin; no public sign-up.
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub actionbridge-dental-mobile-${AppEnv}
      # Public mobile client: no secret; the app uses authorization code + PKCE.
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: !Ref AuthCallbackUrls
      LogoutURLs: !Ref AuthCallbackUrls
      # USER_PASSWORD_AUTH lets the smoke test and a native sign-in form get tokens without a browser redirect.
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub actionbridge-dental-${AppEnv}-${AWS::AccountId}

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref AppEnv
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      # Lets the web app call the API from the browser. API Gateway answers preflight requests
      # itself (no authorizer runs); real requests still need a valid Cognito token.
      CorsConfiguration:
        AllowOrigins: !Ref WebAllowedOrigins
        AllowMethods: [GET, POST, PATCH]
        AllowHeaders: [authorization, content-type, idempotency-key]
        ExposeHeaders: [x-request-id]
        MaxAge: 600

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/.build/health
      Description: GET /health — status and versions only
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /health
            Auth:
              Authorizer: NONE

  CasesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/.build/cases
      Description: Owner-scoped cases, strategy saves and the case ledger (transactional writes)
      Environment:
        Variables:
          TABLE_NAME: !Ref CasesTable
          RETENTION_DAYS: !Ref RetentionDays
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:ConditionCheckItem
                - dynamodb:Query
              Resource: !GetAtt CasesTable.Arn
      Events:
        CreateCase:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/cases
        GetCase:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/cases/{caseId}
        PatchCase:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: PATCH
            Path: /v1/cases/{caseId}
        SaveStrategy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/cases/{caseId}/strategies
        GetLedger:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /v1/cases/{caseId}/ledger

  CalculationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/.build/calculations
      Description: Estimates and schedule comparison from the pure benefits engine (read-only)
      Environment:
        Variables:
          TABLE_NAME: !Ref CasesTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt CasesTable.Arn
      Events:
        Estimate:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/cases/{caseId}/estimates
        Scenarios:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/cases/{caseId}/scenarios
        CoverageComparison:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /v1/cases/{caseId}/coverage-comparison

  HealthLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${HealthFunction}
      RetentionInDays: 7

  CasesLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${CasesFunction}
      RetentionInDays: 7

  CalculationsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${CalculationsFunction}
      RetentionInDays: 7

Outputs:
  ApiBaseUrl:
    Description: Base URL including the stage. Set as EXPO_PUBLIC_API_BASE_URL and API_BASE_URL for the smoke test.
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${AppEnv}
  CasesTableName:
    Description: DynamoDB table holding owner-scoped cases
    Value: !Ref CasesTable
  UserPoolId:
    Description: Cognito user pool for admin-created demo accounts
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Public mobile client ID (not a secret). Set as EXPO_PUBLIC_COGNITO_CLIENT_ID.
    Value: !Ref UserPoolClient
  CognitoIssuer:
    Description: Token issuer checked by the API authorizer
    Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
  ManagedLoginDomain:
    Description: Cognito managed login base URL for the mobile PKCE flow
    Value: !Sub https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
